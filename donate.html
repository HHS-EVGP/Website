<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="Assets/icons/favicon.png">
  <script src="main.js" defer></script>
  <title>Donate</title>
</head>

<body>
  <!--Banner with links-->
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="logo"><img src="Assets/icons/favicon.png" alt="HHS EVGP"></a>

      <nav class="nav">
        <a href="/">Home</a>
        <a href="/contact">Contact</a>
        <a href="/donate" aria-current="page">Donate</a>
        <a href="/resources">Resources</a>
      </nav>

      <div class="socials">
        <a href="https://www.github.com/hhs-evgp"><img src="Assets/icons/github.svg" alt="GitHub"></a>
        <a href="https://www.instagram.com/hhs_evgp"><img src="Assets/icons/instagram.svg" alt="Instagram"></a>
        <span class="social-disabled" title="Coming soon"><img src="Assets/icons/youtube.svg" alt="YouTube (coming soon)"></span>
      </div>
    </div>
  </header>

  <!--Title-->
  <section class="hero hero-short">
    <div class="hero-media bg-[url('Assets/images/Driving.webp')]"></div>

    <div class="hero-text">
      <h1>Support Our <span class="text-hhsred">Mission</span></h1>
      <h3>Make a tax-deductible donation.</h3>
    </div>
  </section>

  <div class="rule"></div>

  <section class="my-10 panel panel-blue mb-5">
    <div class="section split">
      <div class="half" data-reveal>
        <h2>Let Us Know</h2>
        <p>Email us at <a href="mailto:contact@hhsevgp.org">contact@hhsevgp.org</a>, and we will get back to you
          with the next steps.</p>
        <a href="/contact" class="button">Other Ways to Contact Us</a>
      </div>

      <div class="half" data-reveal>
        <img class="picture-square" src="Assets/images/Collaborating.webp">
      </div>
    </div>
  </section>

  <section class="section centered py-30" data-reveal>
    <h2>Our Sponsors</h2>

    <p class="widetext">You guys make our team possible. Thank you for your generous support!</p>

    <div class="section split">
      <div class="half" data-reveal>
        <img class="sponsor" src="Assets/sponsors/interchange.png">
      </div>

      <div class="half" data-reveal>
        <img class="sponsor" src="Assets/sponsors/SVEC.jpg">
      </div>

    </div>
  </section>

</body>

</html>
